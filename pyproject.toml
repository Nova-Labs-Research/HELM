[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "helm-research"
version = "0.1.0"
description = "Hierarchical Execution & Legitimacy Manager: deterministic synthetic governance research"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.15.7"]

[project.scripts]
helm = "helm.experiment:main"
helm-llama-smoke = "helm.smoke:main"

[tool.setuptools.packages.find]
include = ["helm*"]

[tool.setuptools.package-data]
helm = ["structured_output/grammars/*.gbnf"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
